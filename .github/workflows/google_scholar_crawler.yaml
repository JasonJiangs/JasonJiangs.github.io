name: Get Citation Data

on:
  # Twice a day: Scholar rate-limits GitHub's datacenter IPs, so a second
  # attempt from a different runner meaningfully improves the hit rate.
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: the crawler is stdlib-only on purpose.
      - name: Scrape Google Scholar
        working-directory: ./google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python3 main.py

      - name: Publish to the google-scholar-stats branch
        working-directory: ./google_scholar_crawler
        run: |
          if [ ! -f results/gs_data.json ]; then
            echo "::warning::Scholar was unreachable; keeping the previously published data."
            exit 0
          fi
          cd results
          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.json
          git commit -q -m "Updated citation data"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:google-scholar-stats
